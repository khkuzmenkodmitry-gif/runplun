<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUN PLAN · тренировки</title>
<style>
:root{
  --bg:#000;--surface:#0c0c0c;--surface2:#161616;--surface3:#1f1f1f;
  --line:#242424;--text:#fff;--muted:#7a7a7a;--muted2:#4a4a4a;
  --volt:#d4ff00;--orange:#ff6b00;--success:#00e676;--warn:#ffb300;--bad:#ff3b30;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;font-weight:500;letter-spacing:-.01em}
.upper{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:800}
header{padding:22px 20px 12px;max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:22px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .mark{width:26px;height:26px;background:var(--volt);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:16px}
.brand small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
nav{display:flex;gap:4px;padding:0 20px 14px;max-width:1180px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--muted);border:none;padding:10px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;transition:all .15s}
nav button:hover{color:var(--text)}
nav button.active{background:var(--text);color:#000}
main{max-width:1180px;margin:0 auto;padding:0 20px 60px}
section{display:none}
section.active{display:block}
h1,h2,h3{letter-spacing:-.02em;margin:0}
h1{font-size:34px;font-weight:900;line-height:1.05}
h2{font-size:22px;font-weight:900}
h3{font-size:16px;font-weight:800}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.card-h h2{margin:0}
.card-h .link{color:var(--volt);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:10px;font:inherit;font-size:14px;margin-top:4px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--volt)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:11px 16px;border-radius:10px;font-weight:700;font-size:13px;letter-spacing:.02em;transition:all .15s}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--volt);color:#000;border-color:var(--volt)}
.btn.primary:hover{background:#c2eb00}
.btn.dark{background:var(--text);color:#000;border-color:var(--text)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(255,59,48,.4)}
.btn.sm{padding:8px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.hero{background:linear-gradient(135deg,#1a1a1a 0%,#0c0c0c 100%);border-radius:var(--r);padding:24px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(212,255,0,.18),transparent 70%);border-radius:50%}
.hero .date{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.hero h1{margin-bottom:10px;max-width:520px}
.hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.badge.volt{background:var(--volt);color:#000;border:none}
.badge.orange{background:var(--orange);color:#000;border:none}
.badge.rest{background:var(--surface3);color:var(--muted)}

.rings{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center}
@media(max-width:640px){.rings{grid-template-columns:1fr}}
.ring-svg{width:100%;height:auto;display:block}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .qs{background:var(--surface2);border-radius:12px;padding:14px}
.quick .qs .v{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.quick .qs .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:16px 14px}
.stat .v{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--text)}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:6px}
.stat .sub{font-size:11px;color:var(--muted2);margin-top:2px;font-weight:600}
.stat.volt .v{color:var(--volt)}
.stat.orange .v{color:var(--orange)}

.chart{width:100%;height:140px;display:block}
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

.coach{background:linear-gradient(135deg,#1a1400 0%,#0c0c0c 100%);border-radius:var(--r);padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.coach:before{content:"";position:absolute;left:-80px;top:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,107,0,.12),transparent 70%);border-radius:50%;pointer-events:none}
.coach .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative}
.coach .ch .ai{width:36px;height:36px;background:var(--orange);color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.coach .ch h2{font-size:16px}
.coach .ch .s{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px}
.rec{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.rec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rec-ic{width:32px;height:32px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rec-ic.volt{background:rgba(212,255,0,.15);color:var(--volt)}
.rec-ic.orange{background:rgba(255,107,0,.15);color:var(--orange)}
.rec-ic.warn{background:rgba(255,179,0,.15);color:var(--warn)}
.rec-ic.bad{background:rgba(255,59,48,.15);color:var(--bad)}
.rec-title{font-weight:800;font-size:14px}
.rec-meta{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rec-desc{font-size:13px;color:#cfcfcf;line-height:1.5;margin-bottom:10px}
.rec-action{font-size:12px;background:rgba(212,255,0,.08);border-left:3px solid var(--volt);padding:8px 10px;border-radius:0 8px 8px 0;margin-bottom:10px;color:#e9ffa8}
.rec-actions{display:flex;gap:8px}
.rec-actions .btn{flex:1}
.rec-empty{text-align:center;padding:20px 0;color:var(--muted);font-size:13px}

.week{background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.week-head{padding:14px 16px;background:var(--surface2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;align-items:center}
.week-head b{font-size:14px;font-weight:800}
.week-head .phase{background:rgba(212,255,0,.15);color:var(--volt);padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.week-note{padding:10px 16px;color:var(--muted);font-size:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.day{background:var(--surface);padding:12px 10px;min-height:120px;cursor:pointer;transition:background .15s;display:flex;flex-direction:column;gap:6px}
.day:hover{background:var(--surface2)}
.day.rest{opacity:.4}
.day.done{background:#0f1f13}
.day.adjusted{box-shadow:inset 3px 0 0 var(--warn)}
.day.today{box-shadow:inset 0 0 0 2px var(--volt)}
.day-date{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.day-type{font-size:10px;color:var(--volt);text-transform:uppercase;letter-spacing:.06em;font-weight:800;margin-top:2px}
.day-title{font-size:13px;font-weight:700;line-height:1.25}
.day-target{font-size:11px;color:var(--muted);margin-top:auto}
.day-actual{font-size:11px;color:var(--success);font-weight:700}
.day-adjust{font-size:10px;color:var(--warn);font-weight:700}
@media(max-width:800px){.days{grid-template-columns:repeat(2,1fr)}}

.act{background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:10px}
.act-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.act-head b{font-size:14px;font-weight:800}
.pill{display:inline-block;font-size:10px;padding:3px 9px;border-radius:999px;background:var(--surface3);color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.pill.volt{background:var(--volt);color:#000}
.pill.orange{background:var(--orange);color:#000}
.pill.bad{background:rgba(255,59,48,.2);color:var(--bad)}

.wellness-scale{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wellness-scale button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:900;font-size:15px;transition:all .15s}
.wellness-scale button:hover{background:var(--surface3)}
.wellness-scale button.on{background:var(--volt);color:#000;border-color:var(--volt);transform:scale(1.05)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:540px;width:100%;margin:auto;position:relative}
.modal h2{margin:0 0 16px;font-size:20px}
.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-actions .btn{flex:1 1 auto}

.hidden{display:none!important}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">▶</div>
    <div>RUN.PLAN<br><small>Пн · Ср · Пт + Сб 5 км · до 2 мая 2027</small></div>
  </div>
  <div class="upper muted" id="today-badge"></div>
</header>
<nav id="tabs">
  <button data-tab="dash" class="active">Главная</button>
  <button data-tab="plan">План</button>
  <button data-tab="upload">Загрузка</button>
  <button data-tab="diary">Дневник</button>
  <button data-tab="settings">Настройки</button>
</nav>
<main>
  <section id="tab-dash" class="active"></section>
  <section id="tab-plan"></section>
  <section id="tab-upload"></section>
  <section id="tab-diary"></section>
  <section id="tab-settings"></section>
</main>
<script>
(function(){
'use strict';

/* ============ HELPERS ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function addDays(iso, n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d+n); return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
function weekdayOf(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).getDay(); }
function fmtDate(iso, wd=true){
  const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d);
  const w=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dt.getDay()];
  const mm=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][dt.getMonth()];
  return (wd?w+', ':'')+d+' '+mm;
}
function fmtPace(sec){ if(sec==null||!isFinite(sec)) return '—'; const m=Math.floor(sec/60),s=Math.round(sec%60); return m+':'+pad(s); }
function parsePace(str){ if(!str) return null; const m=String(str).match(/(\d+):(\d{1,2})/); return m?(+m[1]*60+ +m[2]):null; }
function parseTime(str){ if(!str) return null; const p=String(str).split(':').map(Number); if(p.length===3) return p[0]*3600+p[1]*60+p[2]; if(p.length===2) return p[0]*60+p[1]; return null; }
function parseNum(str){
  if(str==null) return null; let s=String(str).trim().replace(/\s/g,'');
  if(!s) return null;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/,/g,'');
  else if(s.includes(',')){ const p=s.split(','); if(p.length===2&&p[1].length===3) s=s.replace(',',''); else s=s.replace(',','.'); }
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(sec){ if(!sec||!isFinite(sec)) return '0ч'; const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return h+'ч '+m+'м'; }
function fmtHM(sec){ if(!sec||!isFinite(sec)) return '—'; const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return h+':'+pad(m); }
function average(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; }

/* ============ PLAN BUILDER ============ */
function makeSpec(o){
  return Object.assign({type:'easy',title:'Лёгкий бег',dist:[5,6],pace:[340,360],hr:145,quality:false,paceCheck:true,strength:false,detail:'',status:'planned',actual:null,adjustReason:''},o);
}
const S={
  rec:(d)=>makeSpec({type:'easy',title:'Восстановительный бег',dist:d,pace:[360,390],hr:135}),
  easy:(d,hr=145)=>makeSpec({type:'easy',title:'Лёгкий бег',dist:d,pace:[340,360],hr}),
  fiveEasy:()=>makeSpec({type:'easy',title:'5 км легко',dist:[5,5.2],pace:[340,360],hr:145}),
  fiveTempo:()=>makeSpec({type:'tempo',title:'5 км темпово',dist:[5,5.2],pace:[295,305],hr:165,quality:true,paceCheck:false}),
  tempo:(t,d,p,hr=165)=>makeSpec({type:'tempo',title:t,dist:d,pace:p,hr,quality:true,paceCheck:false}),
  intervals:(t,d,p,hr=170)=>makeSpec({type:'intervals',title:t,dist:d,pace:p,hr,quality:true,paceCheck:false}),
  long:(d,hr=150)=>makeSpec({type:'long',title:'Длительная',dist:d,pace:[340,360],hr,quality:false,paceCheck:true}),
  strength:(base)=>Object.assign({},base,{strength:true}),
  race:()=>makeSpec({type:'race',title:'МАРАФОН',dist:[42.2,42.2],pace:[320,334],hr:160,quality:true,paceCheck:false,detail:'Цель 3:45–3:55'})
};

const WEEKS=[
  {id:1,start:'2026-11-09',phase:'Восстановление',mon:null,wed:S.rec([4,5]),fri:null,sat:S.fiveEasy(),note:'После полумарафона — только лёгкое.'},
  {id:2,start:'2026-11-16',phase:'Восстановление',mon:S.long([10,12],145),wed:S.strength(S.easy([5,6],140)),fri:S.easy([5,6]),sat:S.fiveEasy()},
  {id:3,start:'2026-11-23',phase:'База',mon:S.long([14,14]),wed:S.intervals('Интервалы 4×1000 м',[8,9],[260,265],172),fri:S.strength(S.easy([6,6])),sat:S.fiveEasy()},
  {id:4,start:'2026-11-30',phase:'База',mon:S.long([16,16]),wed:S.tempo('Темпо 2×8 мин',[8,9],[300,305],165),fri:S.easy([7,7]),sat:S.fiveEasy()},
  {id:5,start:'2026-12-07',phase:'База',mon:S.long([14,14]),wed:S.intervals('Интервалы 5×800 м',[7,8],[250,255],172),fri:S.strength(S.easy([6,6])),sat:S.fiveEasy()},
  {id:6,start:'2026-12-14',phase:'База',mon:S.long([18,18]),wed:S.tempo('Темпо 20 мин',[8,10],[300,305],165),fri:S.easy([8,8]),sat:S.fiveEasy()},
  {id:7,start:'2026-12-21',phase:'База',mon:S.long([16,16]),wed:S.intervals('Интервалы 3×1200 м',[8,9],[265,270],170),fri:S.strength(S.easy([6,6])),sat:S.fiveEasy()},
  {id:8,start:'2026-12-28',phase:'Развитие',mon:S.long([12,12],140),wed:S.rec([5,5]),fri:null,sat:S.fiveEasy(),overrides:{'2026-12-31':null,'2027-01-01':null},note:'30.12–01.01 — отдых. 02.01 — субботние 5 км.'},
  {id:9,start:'2027-01-04',phase:'Развитие',mon:S.long([20,20]),wed:S.intervals('Интервалы 5×1000 м',[8,9],[255,260],172),fri:S.easy([8,8]),sat:S.fiveTempo()},
  {id:10,start:'2027-01-11',phase:'Развитие',mon:S.long([22,22]),wed:S.tempo('Темпо 25 мин',[9,10],[295,305],165),fri:S.strength(S.easy([8,8])),sat:S.fiveEasy()},
  {id:11,start:'2027-01-18',phase:'Развитие',mon:S.long([18,18]),wed:S.intervals('Интервалы 4×1500 м',[9,10],[265,270],170),fri:S.easy([7,7]),sat:S.fiveEasy()},
  {id:12,start:'2027-01-25',phase:'Развитие',mon:S.long([24,24]),wed:S.tempo('Темпо 2×12 мин',[9,10],[295,305],165),fri:S.strength(S.easy([8,8])),sat:S.fiveEasy()},
  {id:13,start:'2027-02-01',phase:'Специфика',mon:S.long([26,26]),wed:S.intervals('Интервалы 6×800 м',[8,9],[250,255],172),fri:S.easy([8,8]),sat:S.fiveTempo()},
  {id:14,start:'2027-02-08',phase:'Специфика',mon:S.long([22,22]),wed:S.tempo('Темпо 3×10 мин',[10,11],[295,305],165),fri:S.strength(S.easy([8,8])),sat:S.fiveEasy()},
  {id:15,start:'2027-02-15',phase:'Специфика',mon:S.long([28,28]),wed:S.intervals('Интервалы 4×1200 м',[9,10],[260,265],170),fri:S.easy([6,6]),sat:S.fiveEasy(),overrides:{'2027-02-19':null},note:'19.02 — день рождения, отдых.'},
  {id:16,start:'2027-02-22',phase:'Специфика',mon:S.long([24,24]),wed:S.tempo('Темпо 2×15 мин',[10,11],[290,300],165),fri:S.easy([7,7]),sat:S.fiveEasy()},
  {id:17,start:'2027-03-01',phase:'Специфика',mon:S.long([30,30]),wed:S.intervals('Интервалы 5×1000 м',[8,9],[250,255],172),fri:S.strength(S.easy([8,8])),sat:S.fiveTempo()},
  {id:18,start:'2027-03-08',phase:'Специфика',mon:S.long([26,26]),wed:S.tempo('Темпо 25 мин',[9,10],[295,305],165),fri:S.easy([8,8]),sat:S.fiveEasy()},
  {id:19,start:'2027-03-15',phase:'Специфика',mon:S.long([32,32]),wed:S.intervals('Интервалы 3×2000 м',[10,11],[270,275],170),fri:S.strength(S.easy([7,7])),sat:S.fiveEasy()},
  {id:20,start:'2027-03-22',phase:'Пик',mon:S.long([28,28]),wed:S.tempo('Порог 3×10 мин',[10,11],[290,300],165),fri:S.easy([8,8]),sat:S.fiveEasy()},
  {id:21,start:'2027-03-29',phase:'Пик',mon:S.long([32,32]),wed:S.intervals('Интервалы 6×800 м',[8,9],[250,255],172),fri:S.strength(S.easy([7,7])),sat:S.fiveTempo()},

function buildPlan(){
  const days=[];
  for(const w of WEEKS){
    for(let i=0;i<7;i++){
      const date=addDays(w.start,i); const wd=weekdayOf(date);
      let spec=null;
      if(wd===1) spec=w.mon;
      else if(wd===3) spec=w.wed;
      else if(wd===5) spec=w.fri;
      else if(wd===6) spec=w.sat;
      else if(wd===0 && w.sun) spec=w.sun;
      if(w.overrides && Object.prototype.hasOwnProperty.call(w.overrides,date)) spec=w.overrides[date];
      if(!spec) spec={type:'rest',title:'Отдых',dist:null,pace:null,hr:null,quality:false,paceCheck:false,strength:false,detail:''};
      const day=Object.assign({date,weekId:w.id,phase:w.phase,weekNote:w.note||''},spec);
      day.status=day.status||'planned'; day.actual=day.actual||null; day.adjustReason=day.adjustReason||'';
      days.push(day);
    }
  }
  return days;
}

function findNextQuality(from){ return state.plan.find(d=>d.date>from && (d.type==='tempo'||d.type==='intervals') && d.status!=='done' && !d.autoAdjusted); }
function findNextLong(from){ return state.plan.find(d=>d.date>from && d.type==='long' && d.status!=='done' && !d.autoAdjusted); }
function findNextEasy(from){ return state.plan.find(d=>d.date>from && d.type==='easy' && d.status!=='done' && !d.autoAdjusted && !d.strength); }
function addChange(date,text){ state.changes.unshift({date,text,added:new Date().toISOString()}); if(state.changes.length>200) state.changes.length=200; }

function reactiveAdjust(act){
  const changes=[];
  const day=state.plan.find(d=>d.date===act.date);
  if(!day) return changes;
  const targetHR=day.hr||160;
  const w=state.wellness[act.date]?.score??null;

  // 1) Высокий пульс — разгрузка следующих 3 дней
  if(act.avgHR && act.avgHR>targetHR+8){
    const window=state.plan.filter(d=>d.date>act.date && d.date<=addDays(act.date,3) && d.status!=='done' && d.type!=='rest' && !d.autoAdjusted);
    window.forEach(d=>{
      if(d.type==='tempo'||d.type==='intervals'){
        d.originalTitle=d.originalTitle||d.title;
        d.title='Лёгкий бег (авто: разгрузка)';
        d.type='easy'; d.pace=[350,370]; d.hr=145; d.quality=false; d.paceCheck=true;
        d.dist=[Math.min(6,d.dist?d.dist[0]:6),Math.min(7,d.dist?d.dist[1]:7)];
        d.autoAdjusted=true; d.adjustReason=`Авто: после высокой нагрузки (пульс ${act.avgHR})`;
        changes.push({date:d.date,text:`Качественная → лёгкий бег: пульс ${act.avgHR} на ${fmtDate(act.date,false)}`});
      } else if(d.type==='long' && d.dist){
        d.dist=[Math.round(d.dist[0]*0.9*10)/10,Math.round(d.dist[1]*0.9*10)/10];
        d.autoAdjusted=true; d.adjustReason='Авто: длительная −10%';
        changes.push({date:d.date,text:'Длительная −10% из-за высокой нагрузки'});
      }
    });
  }

  // 2) Плохое самочувствие — заменить следующее качество
  if(w!=null && w<=5){
    const next=findNextQuality(act.date);
    if(next){
      next.originalTitle=next.title;
      next.title='Лёгкий бег (авто: восстановление)';
      next.type='easy'; next.pace=[360,380]; next.hr=140; next.quality=false; next.paceCheck=true;
      next.autoAdjusted=true; next.adjustReason=`Авто: самочувствие ${w}/10`;
      changes.push({date:next.date,text:`Качественная → лёгкий бег: самочувствие ${w}/10`});
    }
  }

  // 3) Лёгкое качество — прогрессия
  if((day.type==='tempo'||day.type==='intervals') && act.avgHR && act.avgHR<=targetHR && (w==null||w>=8)){
    const next=findNextQuality(act.date);
    if(next && next.pace){
      next.pace=[Math.max(240,next.pace[0]-3),Math.max(245,next.pace[1]-3)];
      next.autoAdjusted=true; next.adjustReason='Авто: прогрессия';
      changes.push({date:next.date,text:'Целевой темп следующей качественной −3 сек/км (прогрессия)'});
    }
  }

  // 4) Лёгкая длительная — прогрессия +5%
  if(day.type==='long' && act.avgHR && act.avgHR<=150 && (w==null||w>=8)){
    const next=findNextLong(act.date);
    if(next && next.dist){
      next.dist=[Math.round(next.dist[0]*1.05*10)/10,Math.round(next.dist[1]*1.05*10)/10];
      next.autoAdjusted=true; next.adjustReason='Авто: длительная +5%';
      changes.push({date:next.date,text:'Длительная +5% (прошлая прошла легко)'});
    }
  }
  return changes;
}

function analyzeActivity(act){
  const day=state.plan.find(d=>d.date===act.date);
  const recs=[];
  if(!day){ recs.push({tone:'neutral',icon:'ℹ',title:'Вне плана',text:'Дата не совпадает с планом. Сохранено как дополнительная тренировка.'}); act.analysis={recs}; return; }
  day.status='done';
  day.actual={dist:act.distanceKm,pace:act.avgPaceSec,hr:act.avgHR,maxHR:act.maxHR,duration:act.durationSec};
  day.activityId=act.id;
  if(day.paceCheck && day.pace && act.avgPaceSec){
    const [fast,slow]=day.pace;
    if(act.avgPaceSec<fast-8) recs.push({tone:'warn',icon:'⚡',title:'Бежал быстрее плана',text:`${fmtPace(act.avgPaceSec)}/км при цели ${fmtPace(fast)}–${fmtPace(slow)}. Лишняя интенсивность.`});
    else if(act.avgPaceSec>slow+12) recs.push({tone:'warn',icon:'🐢',title:'Медленнее плана',text:`${fmtPace(act.avgPaceSec)}/км при цели ${fmtPace(fast)}–${fmtPace(slow)}. Возможно, усталость.`});
    else recs.push({tone:'good',icon:'✓',title:'Темп в норме',text:`${fmtPace(act.avgPaceSec)}/км — в диапазоне ${fmtPace(fast)}–${fmtPace(slow)}.`});
  } else if(act.avgPaceSec){
    recs.push({tone:'neutral',icon:'ℹ',title:'Темп',text:`Средний ${fmtPace(act.avgPaceSec)}/км. Для интервалов/темпо средний включает разминку — ориентир по пульсу.`});
  }
  if(act.avgHR && day.hr){
    if(act.avgHR>day.hr+6) recs.push({tone:'warn',icon:'❤️',title:'Высокий пульс',text:`Средний ${act.avgHR} при цели ≤${day.hr}. Слишком интенсивно.`});
    else if(act.avgHR<day.hr-15) recs.push({tone:'good',icon:'❤️',title:'Пульс с запасом',text:`Средний ${act.avgHR} — комфортно.`});
    else recs.push({tone:'good',icon:'❤️',title:'Пульс в норме',text:`Средний ${act.avgHR} — соответствует цели.`});
  }
  if(act.cadence){
    if(act.cadence<165) recs.push({tone:'neutral',icon:'👟',title:'Низкий каденс',text:`${act.cadence} шаг/мин. На лёгких старайтесь 175–182.`});
    else if(act.cadence>=180) recs.push({tone:'good',icon:'👟',title:'Отличный каденс',text:`${act.cadence} шаг/мин.`});
  }
  const w=state.wellness[act.date]?.score;
  if(w!=null && w<=4) recs.push({tone:'warn',icon:'😴',title:'Низкое самочувствие',text:`${w}/10 в этот день. Снизить нагрузку, следить за сном.`});
  const reactive=reactiveAdjust(act);
  reactive.forEach(c=>addChange(c.date,c.text));
  act.analysis={recs,reactive};
}

function applyWellnessRules(){
  const today=todayISO(); const w=state.wellness[today]; if(!w) return;
  const day=state.plan.find(d=>d.date===today);
  if(day && !day.autoAdjusted && day.status==='planned' && (day.type==='tempo'||day.type==='intervals'||day.type==='long')){

    }
  }
}

function generateCoachSuggestions(){
  const out=[]; const today=todayISO();
  const acts=[...state.activities].sort((a,b)=>a.date.localeCompare(b.date));
  if(acts.length<2) return out;
  const last14Start=addDays(today,-14);

  const last28Start=addDays(today,-28);
  const last28=acts.filter(a=>a.date>=last28Start);
  const dismissed=state.coachDismissed||{};
  function isDismissed(id){ const d=dismissed[id]; if(!d) return false; return addDays(d,14)>today; }
  function add(id,icon,tone,title,meta,desc,payload){
    if(isDismissed(id)) return;
    if(state.coachAccepted?.includes(id)) return;

  }
  const hasInt=last14.some(a=>{ const d=state.plan.find(x=>x.date===a.date); return d&&d.type==='intervals'; });
  if(!hasInt && last28.length>=4){
    const t=findNextQuality(today);
    if(t){ add('add_int_'+t.date,'⚡','volt','Добавить интервалы','Скорость · ПАНО','За 2 недели не было интервалов. Предлагаю заменить ближайшее качество на 5×1000 м в темпе 4:15–4:20.',{type:'convert',date:t.date,newType:'intervals',title:'Интервалы 5×1000 м',pace:[255,260],hr:172,dist:[8,9]}); }
  }
  const hasTempo=last14.some(a=>{ const d=state.plan.find(x=>x.date===a.date); return d&&d.type==='tempo'; });
  if(!hasTempo && hasInt && last28.length>=4){
    const t=findNextQuality(today);
    if(t && t.type!=='tempo'){ add('add_tempo_'+t.date,'🔥','orange','Добавить темпо','Порог · выносливость','Давно не было темпо. Предлагаю 2×8 минут по 5:00 — ключевой стимул для марафона.',{type:'convert',date:t.date,newType:'tempo',title:'Темпо 2×8 мин',pace:[300,305],hr:165,dist:[8,9]}); }
  }
  const hasLong=last14.some(a=>{ const d=state.plan.find(x=>x.date===a.date); return d&&d.type==='long'; });
  if(!hasLong && last28.length>=3){
    const t=findNextLong(today)||state.plan.find(d=>d.date>today && d.type==='easy');
    if(t){ add('add_long_'+t.date,'🏃','volt','Добавить длительную','Выносливость · база','Давно не было длительной. Предлагаю 16 км в комфортном темпе 5:40–6:00.',{type:'convert',date:t.date,newType:'long',title:'Длительная',pace:[340,360],hr:150,dist:[16,16]}); }
  }
  const strengthCount=last14.filter(a=>{ const d=state.plan.find(x=>x.date===a.date); return d&&d.strength; }).length;
  if(strengthCount===0){
    const t=state.plan.find(d=>d.date>today && d.type==='easy' && !d.strength && d.status!=='done');
    if(t){ add('add_strength_'+t.date,'💪','orange','Добавить силовую','УФП · профилактика травм','За 2 недели не было силовых. Укрепление ног и кора снижает риск травм.',{type:'strength',date:t.date}); }
  }
  const recentHRs=last14.filter(a=>a.avgHR).map(a=>a.avgHR);
  const prevHRs=last28.filter(a=>a.date<last14Start && a.avgHR).map(a=>a.avgHR);
  if(recentHRs.length>=3 && prevHRs.length>=3){
    const avgRecent=average(recentHRs), avgPrev=average(prevHRs);
    if(avgRecent-avgPrev>=5){
      const t=findNextLong(today);
      if(t){ add('reduce_'+t.date,'⚠️','warn','Уменьшить нагрузку','Восстановление · пульс растёт',`Средний пульс за 2 недели вырос на ${Math.round(avgRecent-avgPrev)} уд. Сократить следующую длительную на 15%.`,{type:'reduce',date:t.date}); }
    }
  }
  const wellnessKeys=Object.keys(state.wellness||{}).filter(k=>k>=addDays(today,-14));
  const recentWellness=wellnessKeys.map(k=>state.wellness[k].score);
  if(recentWellness.length>=3 && average(recentWellness)>=8 && !hasInt && !hasTempo){
    const t=findNextLong(today);
    if(t){ add('increase_'+t.date,'📈','volt','Увеличить объём','Прогрессия · вы готовы',`Самочувствие в среднем ${average(recentWellness).toFixed(1)}/10 — отлично. Можно увеличить длительную на 5%.`,{type:'increase',date:t.date}); }
  }
  return out.slice(0,3);
}

function applyCoachAction(suggestion){
  const {payload}=suggestion;
  const day=state.plan.find(d=>d.date===payload.date);
  if(!day) return false;
  if(payload.type==='convert'){
    day.originalTitle=day.originalTitle||day.title;
    day.type=payload.newType; day.title=payload.title;
    day.pace=payload.pace; day.hr=payload.hr; day.dist=payload.dist;
    day.quality=(payload.newType==='tempo'||payload.newType==='intervals');
    day.paceCheck=(payload.newType==='easy'||payload.newType==='long');
    day.autoAdjusted=true; day.adjustReason='Коуч: '+suggestion.title.toLowerCase();
    addChange(day.date,`Коуч: ${suggestion.title}. ${suggestion.desc}`);

  } else if(payload.type==='increase'){
    if(day.dist){ const n=Math.round(day.dist[1]*1.05*10)/10; day.dist=[Math.round(day.dist[0]*1.05*10)/10,n]; day.autoAdjusted=true; day.adjustReason='Коуч: увеличено на 5%'; addChange(day.date,`Коуч: длительная увеличена до ${n} км.`); }
  }
  state.coachAccepted=state.coachAccepted||[]; state.coachAccepted.push(suggestion.id);
  return true;
}
function dismissCoach(suggestion){

}

/* ============ CSV PARSER ============ */
function splitCSV(line,delim){
  const out=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else { if(c==='"') inQ=true; else if(c===delim){out.push(cur);cur='';} else cur+=c; }
  }
  out.push(cur); return out;
}
function detectDelim(h){ const c={',':(h.match(/,/g)||[]).length,';':(h.match(/;/g)||[]).length,'\t':(h.match(/\t/g)||[]).length}; return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; }
const COLS={type:['Тип занятия','Activity Type'],date:['Дата','Date'],title:['Название','Title'],distance:['Расстояние','Distance'],time:['Время','Time'],avgHR:['Средняя ЧП','Average HR'],maxHR:['Максимальная ЧП','Max HR'],pace:['Средний темп','Average Pace'],cadence:['Средняя частота шага','Average Run Cadence'],calories:['Калории','Calories']};
function parseGarminCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(lines.length<2) return [];
  const delim=detectDelim(lines[0]);
  const header=splitCSV(lines[0],delim).map(h=>h.trim());
  const find=(aliases)=>{ for(const a of aliases){ const i=header.findIndex(h=>h.toLowerCase()===a.toLowerCase()); if(i>=0) return i; } return -1; };
  const idx={}; for(const k in COLS) idx[k]=find(COLS[k]);
  if(idx.date<0||idx.distance<0) return [];
  const out=[];
  for(let i=1;i<lines.length;i++){
    const row=splitCSV(lines[i],delim); const get=k=>idx[k]>=0?(row[idx[k]]||'').trim():'';
    const type=get('type'); if(type && !/бег|running|run/i.test(type)) continue;
    const dateRaw=get('date'); if(!dateRaw) continue;
    const date=dateRaw.split(' ')[0].split('T')[0];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    const dist=parseNum(get('distance')); const dur=parseTime(get('time'));
    const avgHR=parseNum(get('avgHR')); const maxHR=parseNum(get('maxHR')); const cad=parseNum(get('cadence'));
    let pace=parsePace(get('pace')); if(!pace && dist && dur) pace=dur/dist;
    if(!dist) continue;
    out.push({id:'a_'+date+'_'+Math.round(dur||0)+'_'+Math.round(dist*100),date,title:get('title')||'Бег',distanceKm:Math.round(dist*100)/100,durationSec:dur,avgPaceSec:pace?Math.round(pace):null,avgHR:avgHR?Math.round(avgHR):null,maxHR:maxHR?Math.round(maxHR):null,cadence:cad?Math.round(cad):null,calories:parseNum(get('calories'))});
  }
  return out;
}

/* ============ STATS ============ */
function computeStats(){
  const acts=state.activities||[];
  const totalKm=acts.reduce((s,a)=>s+(a.distanceKm||0),0);
  const totalTime=acts.reduce((s,a)=>s+(a.durationSec||0),0);
  const days=new Set(acts.map(a=>a.date)).size;
  const avgHR=acts.filter(a=>a.avgHR).length? Math.round(average(acts.filter(a=>a.avgHR).map(a=>a.avgHR))):0;
  const avgPace=totalKm>0? Math.round(totalTime/totalKm):0;
  const avgCad=acts.filter(a=>a.cadence).length? Math.round(average(acts.filter(a=>a.cadence).map(a=>a.cadence))):0;
  const longest=acts.reduce((m,a)=>Math.max(m,a.distanceKm||0),0);
  const donePlan=state.plan.filter(d=>d.status==='done').length;
  return {totalKm,totalTime,days,avgHR,avgPace,avgCad,longest,donePlan,count:acts.length};
}
function weeklyVolumes(n=8){
  const today=todayISO();
  const end=new Date(today); const weeks=[];
  for(let i=n-1;i>=0;i--){
    const endD=new Date(end); endD.setDate(end.getDate()-i*7);
    const startD=new Date(endD); startD.setDate(endD.getDate()-6);
    const start=startD.toISOString().slice(0,10);
    const stop=endD.toISOString().slice(0,10);
    const km=(state.activities||[]).filter(a=>a.date>=start&&a.date<=stop).reduce((s,a)=>s+(a.distanceKm||0),0);
    weeks.push({start,stop,km:Math.round(km*10)/10,label:'W'+(n-i)});
  }
  return weeks;
}
function trendSeries(n=10){
  const acts=[...(state.activities||[])].sort((a,b)=>a.date.localeCompare(b.date)).slice(-n);
  return {dates:acts.map(a=>a.date),paces:acts.map(a=>a.avgPaceSec).filter(Boolean),hrs:acts.map(a=>a.avgHR).filter(Boolean)};
}

/* ============ MARATHON FORECAST ============ */
function riegel(fromDist, fromSec, toDist){ return fromSec * Math.pow(toDist/fromDist, 1.06); }
function bestEquivalent(daysBack){
  const cutoff=addDays(todayISO(),-daysBack);
  let best=null;
  for(const a of (state.activities||[])){
    if(a.date<cutoff) continue;
    if(!a.distanceKm||!a.avgPaceSec) continue;
    const isRace=(a.distanceKm>=4.5&&a.distanceKm<=5.5&&a.avgPaceSec<270) ||
                 (a.distanceKm>=9.5&&a.distanceKm<=11&&a.avgPaceSec<285) ||
                 (a.distanceKm>=20&&a.distanceKm<=22.5&&a.avgPaceSec<320);
    if(!isRace) continue;
    const t=a.durationSec||(a.avgPaceSec*a.distanceKm);
    if(!best||t<best.sec) best={dist:a.distanceKm,sec:t,date:a.date,title:a.title};
  }
  return best;
}
function findHalfPB(daysBack){
  const cutoff=addDays(todayISO(),-daysBack);
  let best=null;
  for(const a of (state.activities||[])){
    if(a.date<cutoff) continue;
    if(!a.distanceKm||!a.avgPaceSec) continue;
    if(a.distanceKm>=20&&a.distanceKm<=22.5&&a.avgPaceSec<320){
      const t=a.durationSec||(a.avgPaceSec*a.distanceKm);
      if(!best||t<best.sec) best={sec:t,date:a.date};
    }
  }
  return best;
}
function forecastMarathon(){
  const opts=state.settings||{};
  const raceDate=opts.raceDate||'2027-05-02';
  const raceGoal=opts.raceGoalSec||13800;
  const daysBack=opts.oporaDays||90;
  const forecasts=[];

  const opora=bestEquivalent(daysBack);
  if(opora){
    forecasts.push({method:'Ригель',value:riegel(opora.dist,opora.sec,42.195),note:`От ${opora.dist.toFixed(1)} км за ${fmtTime(opora.sec)} (${fmtDate(opora.date,false)})`});
  }
  const thr=(opts.thrPace||305)*1.10;
  forecasts.push({method:'По порогу',value:thr*42.195,note:`Порог ${fmtPace(opts.thrPace||305)}/км × 1.10`});

  const weeks=weeklyVolumes(6);
  const kmPerWeek=average(weeks.map(w=>w.km));
  const halfPB=findHalfPB(daysBack);
  let halfSec=halfPB?halfPB.sec:null;
  if(!halfSec && opora) halfSec=riegel(opora.dist,opora.sec,21.0975);
  if(halfSec){
    const corr=kmPerWeek<40?1.10:kmPerWeek<55?1.03:1.00;
    forecasts.push({method:'По объёму',value:halfSec*2*corr,note:`ПМ ${fmtTime(halfSec)} × 2, объём ${kmPerWeek.toFixed(0)} км/нед (${corr===1?'без поправки':(corr===1.10?'+10%':'+3%')})`});
  }

  if(!forecasts.length) return null;
  const vals=forecasts.map(f=>f.value).sort((a,b)=>a-b);
  const median=vals[Math.floor(vals.length/2)];
  const min=vals[0], max=vals[vals.length-1];
  const goalDiff=(median-raceGoal)/raceGoal;
  let readiness='realistic';
  if(goalDiff>0.05) readiness='ambitious';
  else if(goalDiff<-0.05) readiness='conservative';
  return {forecasts,median,min,max,goalDiff,readiness,raceDate,raceGoal,daysBack,opora,kmPerWeek,halfSec};
}

function targetText(d){
  if(d.type==='rest') return '';
  const p=[];
  if(d.dist) p.push(d.dist[0]===d.dist[1]?d.dist[0]+' км':d.dist[0]+'–'+d.dist[1]+' км');
  if(d.pace) p.push(fmtPace(d.pace[0])+'–'+fmtPace(d.pace[1])+'/км');
  if(d.hr) p.push('пульс ≤'+d.hr);
  return p.join(' · ');
}

    html+='<label style="display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--text);text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">';
    html+='<input type="checkbox" data-imp="'+i+'" '+(dup?'disabled':'checked')+' style="width:auto;margin:0">';
    html+='<span>'+fmtDate(a.date)+' · '+a.distanceKm+' км · '+fmtPace(a.avgPaceSec)+'/км · '+(a.avgHR||'—')+' уд '+(dup?'<span class="pill">уже есть</span>':'')+'</span>';
    html+='</label>';
  });
  html+='<button class="btn primary" id="do-import" style="margin-top:10px">Импортировать выбранные</button>';
  box.innerHTML=html;
  box._acts=acts;
  $('#do-import',box).addEventListener('click',()=>{
    const checks=$$('[data-imp]',box).filter(c=>c.checked&&!c.disabled);
    checks.forEach(c=>{ const a=box._acts[+c.dataset.imp]; state.activities.push(a); analyzeActivity(a); });
    saveState(); renderAll();
  });
}

function renderDiary(){
  const el=$('#tab-diary');
  const today=todayISO();
  const w=state.wellness[today]||{score:7,sleep:7,breath:8,energy:7,note:''};
  let html='<div class="card"><div class="card-h"><h2>'+fmtDate(today)+'</h2></div>';
  html+='<label>Общая оценка (1–10)</label><div class="wellness-scale" id="wellness-scale">';
  for(let i=1;i<=10;i++) html+='<button data-score="'+i+'" class="'+(w.score===i?'on':'')+'">'+i+'</button>';
  html+='</div>';
  html+='<div class="row"><label>Сон <input id="w-sleep" type="number" min="1" max="10" value="'+(w.sleep||7)+'"></label><label>Дыхание <input id="w-breath" type="number" min="1" max="10" value="'+(w.breath||8)+'"></label><label>Энергия <input id="w-energy" type="number" min="1" max="10" value="'+(w.energy||7)+'"></label></div>';
  html+='<label>Заметка<textarea id="w-note">'+escapeHtml(w.note||'')+'</textarea></label>';
  html+='<button class="btn primary" id="w-save" style="margin-top:10px">Сохранить и применить</button>';
  if(w.breath<=4) html+='<div class="rec" style="margin-top:12px;border-color:rgba(255,179,0,.3)"><div class="rec-title" style="color:var(--warn)">⚠️ Внимание (астма)</div><div class="rec-desc">Низкая оценка дыхания. Снизьте нагрузку, при необходимости — к врачу.</div></div>';
  html+='</div>';
  html+='<div class="card"><div class="card-h"><h2>История</h2></div>';
  const keys=Object.keys(state.wellness).sort().reverse();
  if(!keys.length) html+='<div class="empty">Пока нет записей.</div>';
  else {
    if(keys.length>1){
      const vals=keys.slice(0,20).reverse().map(k=>state.wellness[k].score);
      html+='<svg viewBox="0 0 300 50" style="width:100%;height:50px;display:block;margin-bottom:10px">';
      const pts=vals.map((v,i)=>`${(i*300/(vals.length-1)).toFixed(1)},${(50-v/10*50).toFixed(1)}`).join(' ');
      html+='<polyline points="'+pts+'" fill="none" stroke="var(--volt)" stroke-width="2"/>';
      html+='</svg>';
    }
    keys.slice(0,14).forEach(k=>{
      const x=state.wellness[k];
      html+='<div class="act"><div class="act-head"><div><b>'+fmtDate(k)+'</b></div><div class="muted">'+x.score+'/10 · сон '+(x.sleep??'—')+' · дыхание '+(x.breath??'—')+' · энергия '+(x.energy??'—')+'</div></div>';
      if(x.note) html+='<div class="muted" style="margin-top:6px;font-size:13px">'+escapeHtml(x.note)+'</div>';
      html+='</div>';
    });
  }
  html+='</div>';
  el.innerHTML=html;
  let score=w.score;
  $$('#wellness-scale button',el).forEach(b=>{
    b.addEventListener('click',()=>{ score=+b.dataset.score; $$('#wellness-scale button',el).forEach(x=>x.classList.toggle('on',x===b)); });
  });
  $('#w-save',el).addEventListener('click',()=>{
    const sleep=+$('#w-sleep',el).value||null, breath=+$('#w-breath',el).value||null, energy=+$('#w-energy',el).value||null, note=$('#w-note',el).value.trim();
    state.wellness[today]={score,sleep,breath,energy,note};
    applyWellnessRules(); saveState(); renderAll();
  });
}

function renderSettings(){
  const el=$('#tab-settings');
  const s=state.settings;
  let html='<div class="card"><h2>Настройки</h2>';
  html+='<div class="row"><label>Макс. пульс <input id="s-maxhr" type="number" value="'+s.maxHR+'"></label><label>Порог лактата (пульс) <input id="s-thrhr" type="number" value="'+s.thrHR+'"></label><label>Порог (темп) <input id="s-thrpace" value="'+fmtPace(s.thrPace)+'"></label></div>';
  html+='<h3 style="margin-top:16px">Цель: марафон</h3><div class="row">';
  html+='<label>Дата марафона <input id="s-racedate" type="date" value="'+(s.raceDate||'2027-05-02')+'"></label>';
  html+='<label>Целевое время (ч:мм) <input id="s-racegoal" value="'+fmtHM(s.raceGoalSec||13800)+'"></label>';
  html+='<label>Опора для прогноза (дней) <input id="s-opora" type="number" value="'+(s.oporaDays||90)+'"></label>';
  html+='</div>';
  html+='<button class="btn primary" id="s-save" style="margin-top:10px">Сохранить</button></div>';
  html+='<div class="card"><h2>Данные</h2><div class="row">';
  html+='<button class="btn" id="s-export">📥 Экспорт JSON</button>';
  html+='<label style="margin:0;text-transform:none;font-size:13px;letter-spacing:0;color:var(--text);font-weight:500">Импорт JSON<input type="file" id="s-import" accept=".json" style="margin-top:6px"></label>';
  html+='</div><div class="row" style="margin-top:10px">';
  html+='<button class="btn" id="s-reset-adjust">↺ Сбросить автокорректировки</button>';
  html+='<button class="btn danger" id="s-reset-all">🗑 Сбросить всё</button>';
  html+='</div></div>';
  el.innerHTML=html;
  $('#s-save',el).addEventListener('click',()=>{
    state.settings.maxHR=+$('#s-maxhr',el).value||185;
    state.settings.thrHR=+$('#s-thrhr',el).value||160;
    const p=parsePace($('#s-thrpace',el).value); if(p) state.settings.thrPace=p;
    state.settings.raceDate=$('#s-racedate',el).value||'2027-05-02';
    const goal=parseTime($('#s-racegoal',el).value); if(goal) state.settings.raceGoalSec=goal;
    state.settings.oporaDays=+$('#s-opora',el).value||90;
    saveState(); renderAll();
  });
  $('#s-export',el).addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='runplan-'+todayISO()+'.json'; a.click();
    URL.revokeObjectURL(a.href);
  });
  $('#s-import',el).addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{ try{ const data=JSON.parse(ev.target.result); if(!data.plan||!data.plan.length) throw new Error('Неверный формат'); state=data; saveState(); renderAll(); alert('Данные загружены.'); }catch(err){ alert('Ошибка: '+err.message); } };
    r.readAsText(f);
  });
  $('#s-reset-adjust',el).addEventListener('click',()=>{
    if(!confirm('Сбросить все автокорректировки?')) return;
    state.plan.forEach(d=>{ delete d.autoAdjusted; delete d.adjustReason; if(d.originalTitle && d.status!=='done'){ d.title=d.originalTitle; delete d.originalTitle; } });
    state.changes=[]; state.coachAccepted=[]; state.coachDismissed={};
    saveState(); renderAll();
  });
  $('#s-reset-all',el).addEventListener('click',()=>{
    if(!confirm('Удалить все данные и вернуть исходный план?')) return;
    state=initState(); saveState(); renderAll();
  });
}

/* ============ MODAL ============ */
function openEditModal(date){
  const day=state.plan.find(d=>d.date===date); if(!day) return;
  const m=document.createElement('div'); m.className='modal-backdrop';
  m.innerHTML=`
    <div class="modal">
      <h2>${fmtDate(date,true)} · неделя ${day.weekId} · ${escapeHtml(day.phase)}</h2>
      <label>Тип<select id="m-type">${['rest','easy','tempo','intervals','long','race'].map(t=>`<option value="${t}" ${day.type===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select></label>
      <label>Название<input id="m-title" value="${escapeHtml(day.title)}"></label>
      <div class="row">
        <label>Дистанция от, км<input id="m-dmin" type="number" step="0.1" value="${day.dist?day.dist[0]:''}"></label>
        <label>до, км<input id="m-dmax" type="number" step="0.1" value="${day.dist?day.dist[1]:''}"></label>
      </div>
      <div class="row">
        <label>Темп от<input id="m-pmin" placeholder="5:00" value="${day.pace?fmtPace(day.pace[0]):''}"></label>
        <label>до<input id="m-pmax" placeholder="5:05" value="${day.pace?fmtPace(day.pace[1]):''}"></label>
      </div>
      <label>Пульс<input id="m-hr" type="number" value="${day.hr||''}"></label>
      <label>Заметка<textarea id="m-note">${escapeHtml(day.detail||'')}</textarea></label>
      <div class="modal-actions">
        <button class="btn primary" id="m-save">Сохранить</button>
        <button class="btn" id="m-done">✓ Выполнено</button>
        <button class="btn danger" id="m-reset">Сбросить авто</button>
        <button class="btn" id="m-cancel">Отмена</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  $('#m-save',m).addEventListener('click',()=>{
    const type=$('#m-type',m).value;
    day.type=type; day.title=$('#m-title',m).value.trim()||typeLabel(type);
    const dmin=parseFloat($('#m-dmin',m).value), dmax=parseFloat($('#m-dmax',m).value);
    day.dist=(isFinite(dmin)&&isFinite(dmax))?[dmin,dmax]:null;
    const pmin=parsePace($('#m-pmin',m).value), pmax=parsePace($('#m-pmax',m).value);
    day.pace=(pmin&&pmax)?[Math.min(pmin,pmax),Math.max(pmin,pmax)]:null;
    const hr=parseInt($('#m-hr',m).value,10); day.hr=isFinite(hr)?hr:null;
    day.detail=$('#m-note',m).value;
    day.quality=(type==='tempo'||type==='intervals'||type==='race');
    day.paceCheck=(type==='easy'||type==='long');
    saveState(); renderAll(); close();
  });
  $('#m-done',m).addEventListener('click',()=>{ day.status='done'; saveState(); renderAll(); close(); });
  $('#m-reset',m).addEventListener('click',()=>{ delete day.autoAdjusted; delete day.adjustReason; if(day.originalTitle){ day.title=day.originalTitle; delete day.originalTitle; } saveState(); renderAll(); close(); });
  $('#m-cancel',m).addEventListener('click',close);
  m.addEventListener('click',e=>{ if(e.target===m) close(); });
}

/* ============ INIT ============ */
function initTabs(){
  $$('#tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
      $$('main section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+b.dataset.tab));
    });
  });
}
function boot(){
  state=loadState();
  if(!state){ state=initState(); saveState(); }
  // merge settings defaults for old versions
  const defs={maxHR:185,thrHR:160,thrPace:305,raceDate:'2027-05-02',raceGoalSec:13800,oporaDays:90};
  state.settings=Object.assign({},defs,state.settings||{});
  if(!Array.isArray(state.activities)) state.activities=[];
  if(!state.wellness) state.wellness={};
  if(!Array.isArray(state.changes)) state.changes=[];
  if(!state.coachAccepted) state.coachAccepted=[];
  if(!state.coachDismissed) state.coachDismissed={};
  if(!Array.isArray(state.plan)) state.plan=buildPlan();
  initTabs();
  applyWellnessRules();
  saveState();
  renderAll();
}
document.addEventListener('DOMContentLoaded',boot);
})();
</script>
</body>
</html>
